{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digitaliza o código de barras</title>

  <!-- Bootstrap & your styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'styles.css' %}">

  <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #faf8f2;
      color: #2e3a34;
    }
    a { text-decoration: none; color: inherit; }

    /* Header */
    header {
      padding: 1rem;
      position: relative;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
    }
    header .back {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Camera‐frame wrapper */
    .camera-frame {
      width: 80%;
      max-width: 320px;
      aspect-ratio: 4/3;
      position: relative;
      margin: 0 auto 1.5rem;
      background: #555;
      border-radius: 1rem;
      overflow: hidden;
    }
    .camera-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Corner markers on wrapper */
    .camera-frame::before,
    .camera-frame::after,
    .camera-frame .corner-span::before,
    .camera-frame .corner-span::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #e63946;
    }
    .camera-frame::before {
      top: 0; left: 0;
      border-right: none; border-bottom: none;
    }
    .camera-frame::after {
      top: 0; right: 0;
      border-left: none; border-bottom: none;
    }
    .camera-frame .corner-span::before {
      bottom: 0; left: 0;
      border-right: none; border-top: none;
    }
    .camera-frame .corner-span::after {
      bottom: 0; right: 0;
      border-left: none; border-top: none;
    }
    .camera-frame .corner-span {
      display: block;
      width: 0;
      height: 0;
    }

    .instruction {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* Capture button */
    #captureButton {
      background: #69bd93;
      color: white;
      border: none;
      padding: 1rem 1.25rem;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #captureButton img {
      height: 1.5rem;
      width: auto;
    }

    /* Bottom nav */
    nav.fixed-bottom {
      background: #265a40;
    }
    nav .container a img {
      height: 1.5rem;
      width: auto;
    }
    nav .container a {
      padding: .5rem 0;
      flex: 1;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <a href="javascript:history.back()" class="back">&larr;</a>
    Digitaliza o código de barras
  </header>

  <main>
    <!-- Camera‐frame wrapper -->
    <div class="camera-frame">
      <video id="camerafeed" autoplay muted></video>
      <canvas id="canvas" style="display: none;"></canvas>
      <span class="corner-span"></span>
    </div>

    <p class="instruction">Faz scan do código de barras do teu produto</p>

    <!-- capture button -->
    <button id="captureButton">
      <img src="{% static 'icons/camera.png' %}" alt="Capturar">
    </button>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="navbar navbar-dark bg-success fixed-bottom">
    <div class="container d-flex justify-content-around align-items-center">
      <a href="/"><img src="{% static 'icons/home.png' %}" alt="Home"></a>
      <a href="/scan"><img src="{% static 'icons/product_scan.png' %}" alt="Scan"></a>
      <a href="/chatbot"><img src="{% static 'icons/chat.png' %}" alt="Chatbot"></a>
      <a href="/nutritionists"><img src="{% static 'icons/food_bascket.png' %}" alt="Nutritionists"></a>
      <a href="/profile"><img src="{% static 'icons/profile.png' %}" alt="Profile"></a>
    </div>
  </nav>

  <!-- Camera & capture logic -->
  <script>
    const video  = document.getElementById('camerafeed');
    const canvas = document.getElementById('canvas');
    const btn    = document.getElementById('captureButton');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream)
      .catch(err => console.error('Camera error:', err));

    btn.addEventListener('click', () => {
      const ctx = canvas.getContext('2d');
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const imageDataUrl = canvas.toDataURL('image/png');

      const user = {
        username: "{{ request.user.username }}",
        email:    "{{ request.user.email }}",
        height:   "{{ request.user.height }}",
        weight:   "{{ request.user.weight }}",
        goals:    "{{ request.user.goals }}",
        food_restrictions: "{{ request.user.food_restrictions }}",
        diet:     "{{ request.user.diet }}",
        health_problems:   "{{ request.user.health_problems }}"
      };

      fetch("{% url 'upload_image' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({
          data: { image: imageDataUrl },
          user: user
        }),
      })
      .then(res => {
        if (res.redirected) {
          window.location.href = res.url;
        } else {
          return res.json();
        }
      })
      .catch(console.error);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
