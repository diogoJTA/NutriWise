{% load static %}

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" type='text/css' href="{% static 'styles.css' %}">
  <title>Digitaliza o código de barras</title>
  <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #faf8f2;
      color: #2e3a34;
    }
    a { text-decoration: none; color: inherit; }

    /* Header */
    header {
      padding: 1rem;
      position: relative;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
    }
    header .back {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .camera-frame {
      width: 80%;
      max-width: 320px;
      aspect-ratio: 4/3;
      background: #555;
      border-radius: 1rem;
      position: relative;
      margin-bottom: 1.5rem;
    }
    /* red corner markers */
    .camera-frame::before,
    .camera-frame::after,
    .camera-frame span::before,
    .camera-frame span::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #e63946;
    }
    .camera-frame::before { top: 0; left: 0; border-right: none; border-bottom: none; }
    .camera-frame::after  { top: 0; right: 0; border-left: none; border-bottom: none; }
    .camera-frame span::before { bottom: 0; left: 0; border-right: none; border-top: none; }
    .camera-frame span::after  { bottom: 0; right: 0; border-left: none; border-top: none; }
    .camera-frame span {
      display: block;
      width: 100%; height: 100%;
    }

    .instruction {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .scan-btn {
      background: #69bd93;
      color: white;
      border: none;
      padding: 1rem 1.25rem;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    
  </style>
</head>
<body>

  <header>
    <a href="javascript:history.back()" class="back">&larr;</a>
    Digitaliza o código de barras
  </header>

  <main>
    <div class="camera-frame"><span></span></div>
    <p class="instruction">Faz scan do código de barras do teu produto</p>
    <a href="/" class="input-area-icon_nice scan-btn">
      <img src="{% static 'icons/camera.png' %}" alt="Send"> {# Use your send icon #}
    </a>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="navbar navbar-expand fixed-bottom navbar-dark bg-success">
    <div class="container d-flex justify-content-around">
        <a href="/" class="input-area-icon_nice">
            <img src="{% static 'icons/home.png' %}" alt="Send"> {# Use your send icon #}
        </a>
        <a href="/scan" class="input-area-icon_nice">
            <img src="{% static 'icons/product_scan.png' %}" alt="Send"> {# Use your send icon #}
        </a>
        <a href="/chatbot" class="input-area-icon_nice_1">
            <img src="{% static 'icons/chat.png' %}" alt="Send"> {# Use your send icon #}
        </a>
        <a href="/nutritionists" class="input-area-icon_nice_2">
            <img src="{% static 'icons/food_bascket.png' %}" alt="Send"> {# Use your send icon #}
        </a>
        <a href="/profile" class="input-area-icon_nice">
            <img src="{% static 'icons/profile.png' %}" alt="Send"> {# Use your send icon #}
        </a>
    </div>
  </nav>


</body>
</html>
