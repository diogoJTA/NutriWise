{% extends "master.html" %}

{% block title %}
    Product Scan
{% endblock %}

{% load static %}


{% block content %}
   

    <!-- User Dashboard -->
    <section class="container mt-4">
        <div class="card dashboard-card">
            <div class="card-body">
                <h4 class="calories-title">Calorias</h4>
                <div class="d-flex justify-content-between align-items-center calories-box">
                    <div class="calories-info">
                        <div class="progress">
                            <div class="progress-bar bg-success" role="progressbar" 
                                style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                                75%
                            </div>
                        </div>
                        <p class="calories-text"><strong>1350</strong> / 2000 KCal</p>
                        <!-- <h5 class="calories-text">Objetivo: Perda de peso</h5> -->
                    </div>
                    <button class="btn btn-success rounded-circle add-button">+</button>
                </div>
            </div>
        </div>
    </section>



    
    <!-- Recommended Recipes -->
    <section class="container mt-4">
        
        <div class="recipe-card">
            <h3 class="title">Receita do dia</h3>
            <img src="{% static 'assets/ramen.jpg' %}" alt="Ramen de Vaca" class="recipe-img">
            <div class="recipe-info">
                <h5>Ramen de Vaca</h5>
                <p class="protein">Rico em proteína</p>
                <div class="heart-icon">&#10084;</div>
            </div>
        </div>
    </section>
    

  
{% endblock %}
